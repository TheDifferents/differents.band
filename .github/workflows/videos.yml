name: Refresh videos from YouTube

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC daily (~6-7am Charleston)
  workflow_dispatch:        # lets you trigger it by hand from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild data/videos.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 tools/build_videos.py

      - name: Commit if the playlist changed
        run: |
          if [[ -n "$(git status --porcelain data/videos.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/videos.json
            git commit -m "Refresh videos from YouTube playlist"
            git push
          else
            echo "Playlist unchanged."
          fi
